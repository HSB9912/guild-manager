<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="20">
<title>버니 작업 현황</title>
<link rel="icon" type="image/png" href="../favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#fff;color:#1c1c1c;margin:0;padding:32px 24px;line-height:1.5;font-size:16px;}
.wrap{max-width:920px;margin:0 auto;}
h1{font-size:26px;font-weight:900;margin:0 0 4px;}
.meta{color:#777;font-size:14px;margin:0 0 28px;}
h2{font-size:15px;font-weight:900;color:#888;letter-spacing:.04em;text-transform:uppercase;margin:34px 0 12px;border-bottom:2px solid #eee;padding-bottom:6px;}
.big{font-size:22px;font-weight:900;margin:0 0 10px;}
.bar{height:14px;background:#f0f0f0;border-radius:8px;overflow:hidden;}
.bar>i{display:block;height:100%;background:#FF8FAB;}
table{width:100%;border-collapse:collapse;font-size:16px;}
th{text-align:left;color:#999;font-size:13px;font-weight:700;padding:6px 10px;border-bottom:2px solid #eee;}
td{padding:9px 10px;border-bottom:1px solid #f0f0f0;}
tr:hover td{background:#fafafa;}
.grp{font-weight:900;color:#B5446E;background:#fff5f8;}
.st{font-weight:900;}
.done{color:#188a4a;} .wip{color:#d98200;} .frame{color:#999;} .hold{color:#bbb;} .todo{color:#999;}
ol{margin:0;padding-left:22px;} ol li{margin-bottom:7px;}
.s-done::after{content:" ✓ 완료";color:#188a4a;font-weight:900;}
.s-wip::after{content:" · 작업중";color:#d98200;font-weight:900;}
.s-todo::after{content:" · 대기";color:#999;font-weight:700;}
ul.plain{list-style:none;margin:0;padding:0;}
ul.plain li{padding:9px 0;border-bottom:1px solid #f0f0f0;}
ul.plain li b{display:inline-block;min-width:130px;}
.tag{font-size:13px;font-weight:900;padding:1px 8px;border-radius:5px;margin-left:6px;}
.tag.wait{background:#e8f4f8;color:#2a87a6;} .tag.note{background:#fdf3e0;color:#b07a10;} .tag.done{background:#e3f6e9;color:#188a4a;}
.log time{display:inline-block;min-width:54px;color:#aaa;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐰 버니 길드 리뉴얼 · 작업 현황</h1>
  <p class="meta">기준: <b id="dataTime"></b> &nbsp;|&nbsp; 지금 <span id="clock"></span> &nbsp;|&nbsp; 20초마다 자동 새로고침</p>

  <h2>전체 진행률</h2>
  <p class="big"><span id="pct"></span>% &nbsp; <span style="font-size:15px;color:#777;font-weight:700">단계 <span id="phaseTxt"></span> · 페이지 <span id="pageTxt"></span></span></p>
  <div class="bar"><i id="bar" style="width:0"></i></div>

  <h2>진행 단계</h2>
  <ol id="phases"></ol>

  <h2>사이트맵 · 페이지별 상태 (21)</h2>
  <table><thead><tr><th style="width:160px">그룹</th><th>페이지</th><th style="width:90px">상태</th></tr></thead>
  <tbody id="sitemap"></tbody></table>

  <h2>결정 대기 · 메모</h2>
  <ul class="plain" id="decisions"></ul>

  <h2>최근 변경</h2>
  <ul class="plain log" id="log"></ul>
</div>

<script>
/* ====== 작업할 때마다 이 데이터만 갱신 ====== */
const STATUS = {
  dataTime: '2026-06-21 · 🎉 21/21 완료 · 충실도 포팅 진행중',
  phases: [
    ['디자인 방향 선정 — G(벤토)안 확정','done'],
    ['IA · 메뉴 구조 확정 — 4그룹 21메뉴','done'],
    ['와꾸 · 멀티페이지 셸 (탭별 URL + 공통 CSS/JS)','done'],
    ['백엔드 인증 — Supabase 로그인·권한 게이팅','done'],
    ['페이지별 구현 — 21/21 전부 완료 ✓','done'],
    ['배포 · index 교체','todo'],
  ],
  // 상태: done 완료 / wip 작업중 / frame 와꾸 / hold 보류
  groups: [
    ['일반', [
      ['홈','done'],['길드원','done'],['수로 분석 ⭐','done'],['승강제·현황','done'],
      ['수로 보상','done'],['버니버디','done'],['아이템 컨설팅','done'],['사용 안내','done'],
    ]],
    ['멤버 신청', [
      ['가입 신청','done'],['장기부재 캐릭 등록','done'],['보석금 신청','done'],
    ]],
    ['관리자 운영 🔒', [
      ['신청 처리','done'],['보석금 관리','done'],['벌점','done'],['운영진 할 일','done'],['장기부재 면제','done'],
    ]],
    ['관리자 도구 🔒', [
      ['수로 입력 ⭐','done'],['직위 반영 ⭐','done'],['가이드 편집','done'],['동기화','done'],['설정','done'],
    ]],
  ],
  decisions: [
    ['관리 범위','done','연합 아님 — 메인길드 버니 + 부길드 늑대·쿠거. 전역은 버니 고정, 길드원 페이지 탭에서 메인/부길드 골라보기. 194/159/199명'],
    ['동기화','done','완성! 정책변경 반영 — 전체 길드원 다 잡기(451명, 부캐 포함). 신규는 is_main=false로 추가→수로/직위 안깨짐. 인게임명 버니 조회, DB키 뚠카롱 유지. ⚠라이브 공유DB라 적용은 운영진이 직접'],
    ['버니버디','wait','전용 테이블 없음 — 어떤 기능인지 한 줄 필요'],
    ['보석금 신청폼','note','금액 계산 규칙 포팅 필요'],
    ['쓰기 기능 테스트','note','승인/점수입력/직위적용 — 실 운영진 로그인으로 확인 필요'],
    ['아이템 컨설팅','done','원본 뚠카롱 컨설팅 게시판 그대로 재이식 — DB 기록(item_consultings) 목록/상세/작성/수정·교체 Before/After·효율분석·세트묶기·잠재드롭다운·넥슨 자동가져오기·R2 첨부 전부. (직전엔 넥슨 장비조회만 있어서 기능/기록 달랐음) Tailwind 온디맨드+호환셸. MCP검증'],
  ['원본 충실도 — 남은 단순화','note','members(부캐아코디언/CRUD)·analysis(MVP/차트)·suro_input(붙여넣기/OCR)·settings/guide_edit(구조화에디터)·buddy(룰렛)·suro_reward(등급산정) — 기능 동작은 OK, 원본만큼 풍부친 않음'],
    ['수로 보상','note','내부 조정 중 · 6/30 (현재 config값 표시 중)'],
  ],
  log: [
    ['방금','뚠뚱카롱 흔적 전부 제거 — 보석금 기본금액표·뱃지·내역, 가입게이지 랭크(뚱카롱2기→늑대2기)·기준(뚠카롱→버니), 창고내역까지 모두 버니/늑대/쿠거 표시. guildLabel()·dispGuildStr() 매핑(DB키는 유지). 전 HTML 에셋 ?v= 캐시버스팅(옛 app.js 캐시 탈출). MCP검증'],
    ['이전','길드 구조 정정 — 연합(X) → 메인길드 버니 + 부길드 늑대·쿠거. 사이드바 부제 "뚠뚱카롱 연합"→"부길드 늑대·쿠거", 길드원 탭에 메인/부길드 구분'],
    ['이전','아이템 컨설팅 = 원본 뚠카롱 게시판 그대로 재이식 (기존엔 넥슨 장비조회뿐이라 기록/기능 달랐음). item_consultings 목록/상세/작성·교체Before/After·효율분석·세트묶기·넥슨자동·R2첨부 전부 · MCP검증(기록6건·상세풀렌더·작성폼)'],
    ['이전','충실도 포팅 — 보석금폼(본캐검색+부캐매핑+다중선택)·홈(실데이터)·requests(승인시 영구기록 자동등록)·가입폼 수로게이지(동적컷) MCP검증'],
    ['이전','버니버디 = 옛 뚠뚠버디(멘토-멘티 팀) 그대로 포팅 (랜덤매칭 폐기)'],
    ['이전','전역 3팩션 스위처 제거 → 길드원 페이지 내 팩션 탭(버니/늑대/쿠거). 194/159/199명'],
    ['이전','동기화 완성 — 전체 다 잡기. 넥슨 버니 451명→DB비교(신규260/탈퇴3)→부캐로 추가. 실스캔 MCP검증'],
    ['이전','동기화 돌파 조사 — 유니온으로 본캐 판별 가능 검증(표본40 DB 100%일치)'],
    ['이전','동기화 조사 — 넥슨 길드 API가 계정그룹 새끼까지 417명 반환(본캐 플래그 없음) 확인'],
    ['이전','수로 입력(점수 일괄)·직위 반영(autoRank 자동계산+체크박스 선택적용) 연결 (MCP 검증)'],
    ['이전','수로보상(룰렛)·사용안내(가이드6)·가이드편집·설정(config) 연결 + 승강제 위계순 개선 (MCP 검증)'],
    ['이전','장기부재 면제·등록폼·운영진 할 일 연결 → 관리자 운영 그룹 5/5 완료 (MCP 검증)'],
    ['이전','수로 분석(회차별 랭킹)·보석금 관리(창고잔액)·벌점·가입폼 실 DB 연결 (MCP 검증)'],
    ['이전','길드원·승강제·현황·신청처리 페이지 실 DB 연결 — 검색/필터/정렬 동작 (MCP 검증)'],
    ['이전','Supabase 인증·로그인 백본 연결 — 게스트/멤버/운영진 권한 게이팅 (MCP 검증)'],
    ['이전','백엔드 연결 지점·권한 게이팅·목데이터 시임 추가 (app.js)'],
    ['이전','멀티페이지(MPA) 셸 완성 — 탭별 21개 HTML + 공통 CSS/JS'],
    ['이전','Tailwind CDN 제거 → 경량화'],
    ['이전','디자인 시안 14종 → G(벤토)안 확정 · UX 인벤토리 26→21'],
  ],
};
const WORD={done:['done','완료'],wip:['wip','작업중'],frame:['frame','와꾸'],hold:['hold','보류'],todo:['todo','대기']};
const TAGLBL={wait:'결정 필요',note:'메모',done:'확정 ✓'};

document.getElementById('dataTime').textContent = STATUS.dataTime;
document.getElementById('phases').innerHTML = STATUS.phases.map(p=>`<li class="s-${p[1]}">${p[0]}</li>`).join('');
document.getElementById('sitemap').innerHTML = STATUS.groups.map(g=>
  g[1].map((it,i)=>`<tr>${i===0?`<td class="grp" rowspan="${g[1].length}">${g[0]}</td>`:''}<td>${it[0]}</td><td class="st ${it[1]}">${WORD[it[1]][1]}</td></tr>`).join('')
).join('');
document.getElementById('decisions').innerHTML = STATUS.decisions.map(d=>`<li><b>${d[0]}</b>${d[2]}<span class="tag ${d[1]}">${TAGLBL[d[1]]}</span></li>`).join('');
document.getElementById('log').innerHTML = STATUS.log.map(l=>`<li><time>${l[0]}</time> ${l[1]}</li>`).join('');

const pages = STATUS.groups.flatMap(g=>g[1]);
const dP = pages.filter(p=>p[1]==='done').length, dPh = STATUS.phases.filter(p=>p[1]==='done').length;
const pct = Math.round(dPh/STATUS.phases.length*60 + dP/pages.length*40);
document.getElementById('pct').textContent = pct;
document.getElementById('bar').style.width = pct+'%';
document.getElementById('phaseTxt').textContent = dPh+'/'+STATUS.phases.length;
document.getElementById('pageTxt').textContent = dP+'/'+pages.length;

function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false});}
tick();setInterval(tick,1000);
</script>
</body>
</html>
