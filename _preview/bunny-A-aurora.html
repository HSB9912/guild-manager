<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>버니 · A. Glass Aurora</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
:root{
  --night:#1A1626; --moon:#EDE6DA; --grey:#9B93A8;
  --bunny-main:#FF8FAB; --bunny-light:#FFC9DE; --bunny-cream:#FFE8D6; --bunny-deep:#B5446E;
}
*{font-family:'Noto Sans KR',sans-serif;}
body{background:var(--night);color:var(--moon);margin:0;overflow-x:hidden;}
.bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;}
.orb1{width:480px;height:480px;background:var(--bunny-main);top:-160px;left:-80px;}
.orb2{width:420px;height:420px;background:var(--bunny-deep);bottom:-180px;right:-60px;opacity:.4;}
.orb3{width:300px;height:300px;background:var(--bunny-light);top:40%;left:55%;opacity:.18;}
.glass{background:rgba(255,255,255,.045);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);}
.glass-strong{background:rgba(255,255,255,.07);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.1);}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:14px;color:var(--grey);font-weight:500;font-size:14px;transition:.2s;cursor:pointer;}
.nav-item:hover{background:rgba(255,143,171,.1);color:var(--moon);}
.nav-item.active{background:rgba(255,143,171,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,143,171,.3);}
.nav-item.active i{color:var(--bunny-main);}
.stat-card{position:relative;overflow:hidden;border-radius:22px;padding:20px;}
.stat-card::after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;background:var(--bunny-main);filter:blur(40px);opacity:.22;top:-40px;right:-30px;}
.pill{background:var(--bunny-main);color:var(--night);font-weight:700;}
table{border-collapse:separate;border-spacing:0;}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);font-weight:700;text-align:left;padding:12px 16px;}
td{padding:13px 16px;font-size:13px;border-top:1px solid rgba(255,255,255,.05);}
tr:hover td{background:rgba(255,143,171,.05);}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
</style>
</head>
<body class="min-h-screen">
<div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

<div class="relative z-10 flex min-h-screen">
  <!-- Sidebar -->
  <aside class="glass w-64 m-4 rounded-3xl p-5 flex flex-col gap-2 self-start sticky top-4">
    <div class="flex items-center gap-3 px-2 pb-5 mb-3 border-b border-white/10">
      <div class="w-11 h-11 rounded-2xl grid place-items-center text-xl" style="background:linear-gradient(135deg,var(--bunny-main),var(--bunny-deep))">🐰</div>
      <div>
        <div class="font-black text-base leading-tight">버니 길드</div>
        <div class="text-[11px]" style="color:var(--grey)">뚠뚱카롱 연합</div>
      </div>
    </div>
    <div class="nav-item active"><i class="fa-solid fa-house w-5"></i> 대시보드</div>
    <div class="nav-item"><i class="fa-solid fa-users w-5"></i> 멤버 관리</div>
    <div class="nav-item"><i class="fa-solid fa-chart-line w-5"></i> 출석 · 점수</div>
    <div class="nav-item"><i class="fa-solid fa-user-plus w-5"></i> 가입 신청 <span class="ml-auto pill text-[10px] px-2 py-0.5 rounded-full">3</span></div>
    <div class="nav-item"><i class="fa-solid fa-gem w-5"></i> 보석금</div>
    <div class="nav-item"><i class="fa-solid fa-calendar w-5"></i> 일정</div>
    <div class="mt-auto pt-4 glass-strong rounded-2xl p-3 mt-6 flex items-center gap-3">
      <div class="w-9 h-9 rounded-full grid place-items-center font-bold" style="background:var(--bunny-light);color:var(--night)">홍</div>
      <div class="text-xs"><div class="font-bold">관리자</div><div style="color:var(--grey)">운영진</div></div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-4 pl-0 pr-6">
    <!-- Header -->
    <header class="glass rounded-3xl px-6 py-4 flex items-center justify-between mb-5">
      <div>
        <div class="text-[11px] mb-0.5" style="color:var(--grey)">대시보드</div>
        <h1 class="text-2xl font-black">안녕하세요, 버니 길드 👋</h1>
      </div>
      <div class="flex items-center gap-3">
        <div class="glass-strong rounded-full px-4 py-2 text-sm"><i class="fa-solid fa-user-group mr-2" style="color:var(--bunny-main)"></i>멤버 <b>48</b>명</div>
        <button class="w-10 h-10 rounded-full glass-strong grid place-items-center"><i class="fa-regular fa-bell"></i></button>
      </div>
    </header>

    <!-- Stat cards -->
    <div class="grid grid-cols-4 gap-4 mb-5">
      <div class="glass stat-card"><div class="text-[11px]" style="color:var(--grey)">총 멤버</div><div class="text-3xl font-black mt-1">48</div><div class="text-xs mt-2" style="color:var(--bunny-light)"><i class="fa-solid fa-arrow-up"></i> +2 이번주</div></div>
      <div class="glass stat-card"><div class="text-[11px]" style="color:var(--grey)">주간 평균점수</div><div class="text-3xl font-black mt-1">86<span class="text-lg" style="color:var(--grey)">점</span></div><div class="text-xs mt-2" style="color:var(--bunny-light)"><i class="fa-solid fa-arrow-up"></i> +4 지난주比</div></div>
      <div class="glass stat-card"><div class="text-[11px]" style="color:var(--grey)">가입 대기</div><div class="text-3xl font-black mt-1">3</div><div class="text-xs mt-2" style="color:var(--grey)">검토 필요</div></div>
      <div class="glass stat-card"><div class="text-[11px]" style="color:var(--grey)">이번주 결석률</div><div class="text-3xl font-black mt-1">6<span class="text-lg" style="color:var(--grey)">%</span></div><div class="text-xs mt-2" style="color:var(--bunny-light)"><i class="fa-solid fa-arrow-down"></i> 양호</div></div>
    </div>

    <div class="grid grid-cols-3 gap-4">
      <!-- Member table -->
      <div class="glass rounded-3xl col-span-2 overflow-hidden">
        <div class="flex items-center justify-between px-6 pt-5 pb-3">
          <h2 class="font-bold">멤버 현황</h2>
          <button class="text-xs glass-strong rounded-full px-3 py-1.5">전체 보기 <i class="fa-solid fa-chevron-right ml-1"></i></button>
        </div>
        <table class="w-full">
          <thead><tr><th>닉네임</th><th>역할</th><th>주간점수</th><th>출석</th><th>상태</th></tr></thead>
          <tbody>
            <tr><td class="font-semibold">달토끼</td><td style="color:var(--grey)">부길드장</td><td class="font-bold">98</td><td>7/7</td><td><span class="badge" style="background:rgba(255,143,171,.18);color:var(--bunny-light)">활동중</span></td></tr>
            <tr><td class="font-semibold">초코롱</td><td style="color:var(--grey)">멤버</td><td class="font-bold">91</td><td>6/7</td><td><span class="badge" style="background:rgba(255,143,171,.18);color:var(--bunny-light)">활동중</span></td></tr>
            <tr><td class="font-semibold">밤하늘</td><td style="color:var(--grey)">멤버</td><td class="font-bold">74</td><td>4/7</td><td><span class="badge" style="background:rgba(244,183,64,.18);color:#F4B740">주의</span></td></tr>
            <tr><td class="font-semibold">민트우유</td><td style="color:var(--grey)">신입</td><td class="font-bold">88</td><td>7/7</td><td><span class="badge" style="background:rgba(255,143,171,.18);color:var(--bunny-light)">활동중</span></td></tr>
            <tr><td class="font-semibold">구름빵</td><td style="color:var(--grey)">멤버</td><td class="font-bold">52</td><td>2/7</td><td><span class="badge" style="background:rgba(181,68,110,.25);color:#FF8FAB">결석多</span></td></tr>
          </tbody>
        </table>
      </div>

      <!-- Side widget: weekly attendance -->
      <div class="glass rounded-3xl p-6">
        <h2 class="font-bold mb-4">주간 출석</h2>
        <div class="flex items-end justify-between gap-2 h-40">
          <div class="flex flex-col items-center gap-2 flex-1"><div class="w-full rounded-t-lg" style="height:70%;background:linear-gradient(var(--bunny-light),var(--bunny-main))"></div><span class="text-[11px]" style="color:var(--grey)">월</span></div>
          <div class="flex flex-col items-center gap-2 flex-1"><div class="w-full rounded-t-lg" style="height:85%;background:linear-gradient(var(--bunny-light),var(--bunny-main))"></div><span class="text-[11px]" style="color:var(--grey)">화</span></div>
          <div class="flex flex-col items-center gap-2 flex-1"><div class="w-full rounded-t-lg" style="height:60%;background:linear-gradient(var(--bunny-light),var(--bunny-main))"></div><span class="text-[11px]" style="color:var(--grey)">수</span></div>
          <div class="flex flex-col items-center gap-2 flex-1"><div class="w-full rounded-t-lg" style="height:100%;background:linear-gradient(var(--bunny-cream),var(--bunny-deep))"></div><span class="text-[11px]" style="color:var(--bunny-main)">목</span></div>
          <div class="flex flex-col items-center gap-2 flex-1"><div class="w-full rounded-t-lg" style="height:78%;background:linear-gradient(var(--bunny-light),var(--bunny-main))"></div><span class="text-[11px]" style="color:var(--grey)">금</span></div>
        </div>
        <div class="glass-strong rounded-2xl p-3 mt-5 text-center">
          <div class="text-[11px]" style="color:var(--grey)">목요일 정모 평균</div>
          <div class="text-2xl font-black" style="color:var(--bunny-main)">94<span class="text-sm">%</span></div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
